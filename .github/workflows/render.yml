name: Render Video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system deps (Chrome libs + emoji font)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji libnss3 libdbus-1-3 libatk1.0-0 \
            libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm install

      - name: Render
        run: npx remotion render src/index.ts WordTips out/word-tips.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: word-tips-video
          path: out/word-tips.mp4
